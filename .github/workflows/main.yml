name: Build exe
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconsole --onefile --name BatteryCellViewer app.py
      - uses: actions/upload-artifact@v4
        with:
          name: BatteryCellViewer-windows
          path: dist/BatteryCellViewer.exe
